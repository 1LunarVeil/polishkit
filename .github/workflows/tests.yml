name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest moved to Ubuntu 26.04 in October 2026, and
          # actions/python-versions has no Python 3.9 build for 26.04 yet.
          # Pin 24.04 so the oldest supported Python is actually exercised.
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Scanner finds the planted defects
        shell: bash
        run: |
          set +e
          python skills/polishkit/scripts/slop_scan.py tests/fixtures/tells/index.html
          status=$?
          if [ "$status" -ne 1 ]; then
            echo "expected exit status 1 for the tells fixture, got $status"
            exit 1
          fi

      - name: Scanner stays quiet on clean code
        run: python skills/polishkit/scripts/slop_scan.py tests/fixtures/clean/app.css

      - name: Reference contrast values
        shell: bash
        run: |
          python skills/polishkit/scripts/wcag.py "#000000" "#ffffff" | tee /tmp/wcag.txt
          grep -q "21.00:1" /tmp/wcag.txt

      - name: Lookup resolves a product type
        shell: bash
        run: |
          python skills/polishkit/scripts/design_lookup.py "portfolio" | grep -q "# Detail: Portfolio/Personal"

      - name: Image diff finds the exact changed region
        shell: bash
        run: |
          python tests/make_fixtures.py
          python skills/polishkit/scripts/image_diff.py \
            tests/fixtures/png/flat.png tests/fixtures/png/box.png | tee /tmp/diff.txt
          grep -q "changed 480 px (18.75%), region x=10 y=8 30x16" /tmp/diff.txt

      - name: Capture tool rejects an unsafe URL
        shell: bash
        run: |
          set +e
          python skills/polishkit/scripts/visual_capture.py \
            "file:///etc/passwd" --out "$RUNNER_TEMP/shots"
          status=$?
          if [ "$status" -ne 3 ]; then
            echo "expected exit status 3 for a rejected URL, got $status"
            exit 1
          fi

      # The audits need a browser for the real work, so CI checks the contract
      # that matters most: with nothing to measure, they claim nothing. The
      # "no browser" condition is simulated with a stub rather than relied on,
      # because a runner may well have Chromium and then exit for a different
      # reason — a test that passes for the wrong reason proves nothing.
      # The check lives in tests/ci_no_browser.py: a heredoc inside a YAML
      # block would have to break Python's own indentation rules.
      - name: Audits claim nothing without a browser
        run: python -B tests/ci_no_browser.py

      - name: Audits reject an unsafe URL
        shell: bash
        run: |
          for tool in page_audit keyboard_audit text_spacing reflow cjk_breaks expression_audit; do
            set +e
            python "skills/polishkit/scripts/${tool}.py" "file:///etc/passwd"
            status=$?
            set -e
            if [ "$status" -ne 3 ]; then
              echo "expected exit status 3 from ${tool}, got $status"
              exit 1
            fi
          done

      # crosscheck drives the three audits, so here it can only be asked the
      # one thing it owes without a browser: a rejected URL exits 3 and says
      # so, rather than printing an empty table that reads like a clean page.
      - name: Crosscheck rejects an unsafe URL
        shell: bash
        run: |
          set +e
          output=$(python tools/crosscheck.py "file:///etc/passwd")
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 3 ]; then
            echo "expected exit status 3 from crosscheck, got $status"
            exit 1
          fi
          echo "$output" | grep -q '"verified": false'

      # The README benchmark tables are generated views of RESULTS.md
      # (tools/benchmark_tables.py). 2.2.10 shipped with the READMEs still
      # carrying the old numbers for a full release; this check makes that
      # drift fail CI instead of waiting for a review to find it.
      - name: README benchmark tables match RESULTS.md
        run: python tools/benchmark_tables.py --check

      # The corrected palette set is derived from colors.csv by a documented
      # algorithm; regenerating must reproduce the shipped file byte for byte.
      - name: Corrected palette set matches its derivation
        run: python tools/palette_correct.py --check

  # The unit matrix runs without a browser by design; the integration path
  # (Chrome launched, WebSocket driven, screenshots decoded) had zero CI
  # coverage until the external review pointed at it. The runners'
  # preinstalled Chrome then failed this job three runs in a row (ubuntu) and
  # once (windows) with no code change — so instead of trusting whatever the
  # image ships, the job downloads a pinned Chrome for Testing build and the
  # audits find it through POLISHKIT_BROWSER. Deterministic the same way the
  # benchmark's ENVIRONMENT.json pins everything else.
  browser-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install a pinned Chrome for Testing
        shell: bash
        run: |
          set -e
          curl -fsSL "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json" -o cft.json
          if [ "$RUNNER_OS" = "Linux" ]; then platform=linux64; else platform=win64; fi
          url=$(python -c "import json; d=json.load(open('cft.json')); print([item['url'] for item in d['channels']['Stable']['downloads']['chrome'] if item['platform'] == '$platform'][0])")
          echo "chrome for testing url: $url"
          curl -fsSL "$url" -o chrome.zip
          mkdir chrome-cft
          if [ "$RUNNER_OS" = "Linux" ]; then
            unzip -q chrome.zip -d chrome-cft
            echo "POLISHKIT_BROWSER=$GITHUB_WORKSPACE/chrome-cft/chrome-linux64/chrome" >> "$GITHUB_ENV"
            # Ubuntu 24.04 restricts unprivileged user namespaces (AppArmor),
            # which aborts a stock Chrome with SIGABRT before the debug port
            # opens; Chrome for Testing ships no AppArmor profile. Explicit,
            # job-scoped, and only on this throwaway runner.
            echo "POLISHKIT_CHROME_EXTRA_ARGS=--no-sandbox" >> "$GITHUB_ENV"
          else
            unzip -q chrome.zip -d chrome-cft
            echo "POLISHKIT_BROWSER=$GITHUB_WORKSPACE/chrome-cft/chrome-win64/chrome.exe" >> "$GITHUB_ENV"
          fi

      - name: Real-browser smoke (page_audit + keyboard_audit over CDP)
        run: python -B tests/smoke_browser.py
